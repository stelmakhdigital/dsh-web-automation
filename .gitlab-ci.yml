# GitLab CI for dsh-web-automation.
#
# Stages:
#   1. typecheck — tsc (core + browser) against the `types/deepseek-ai.d.ts`
#      stubs (fast; the `@deepseek-ai/*` peer deps are not installed in the
#      plugin's own `node_modules`). A stricter check against the real DSH
#      host sources is available locally via `DSH_HOST=... npm run typecheck:host`.
#   2. build — esbuild (core + browser), verify lib/ is in sync.
#   3. test  — vitest (SSRF guard, store, enrichment/platform SSRF, browser).
#
# The build (esbuild) is the authoritative gate: it bundles the real code and
# fails on syntax/import errors.

image: node:22

stages:
  - typecheck
  - build
  - test

variables:
  # Peer deps are absent outside a DSH deployment; skip peer resolution.
  NPM_FLAGS: "--legacy-peer-deps --no-audit --no-fund"

typecheck:
  stage: typecheck
  script:
    - npm install $NPM_FLAGS
    - npm run typecheck
  rules:
    - changes:
        - "src/**/*"
        - "browser/src/**/*"
        - "types/**/*"
        - "tsconfig.json"
        - "browser/tsconfig.json"
        - "package.json"

build:
  stage: build
  script:
    - npm install $NPM_FLAGS
    - npm run build
    - npm run build --prefix browser
    # lib/ must be in sync with src/ (the pre-built bundle is committed).
    # (quoted: the unquoted "ERROR: ..." scalar is invalid YAML per spec)
    - 'git diff --exit-code -- lib browser/lib || (echo "ERROR: lib/ is out of sync with src/. Run npm run build and commit." && exit 1)'
  rules:
    - changes:
        - "src/**/*"
        - "browser/src/**/*"
        - "package.json"
        - "browser/package.json"
        - "esbuild.config.mjs"
        - "browser/esbuild.config.mjs"

test:
  stage: test
  script:
    - npm install $NPM_FLAGS
    - npx vitest run
  rules:
    - changes:
        - "src/**/*"
        - "test/**/*"
        - "package.json"
        - "vitest.config.ts"
