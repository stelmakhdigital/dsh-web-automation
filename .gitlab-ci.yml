# GitLab CI for dsh-web-automation.
#
# Stages:
#   1. typecheck — tsc (core + browser) against the `types/deepseek-ai.d.ts`
#      stubs (the `@deepseek-ai/*` peer deps are not installed in the plugin's
#      own `node_modules`; the stubs mirror the public API surface the plugin
#      imports).
#   2. build — esbuild (core + browser), verify lib/ is in sync.
#   3. test  — vitest (SSRF guard + store).
#
# The build (esbuild) is the authoritative gate: it bundles the real code and
# fails on syntax/import errors. The typecheck is a best-effort static check
# against the stubs.

image: node:22

stages:
  - typecheck
  - build
  - test

variables:
  # Peer deps are absent outside a DSH deployment; skip peer resolution.
  NPM_FLAGS: "--legacy-peer-deps --no-audit --no-fund"

typecheck:
  stage: typecheck
  script:
    - npm install $NPM_FLAGS
    - npm run typecheck
  rules:
    - changes:
        - "src/**/*"
        - "browser/src/**/*"
        - "types/**/*"
        - "tsconfig.json"
        - "browser/tsconfig.json"
        - "package.json"

build:
  stage: build
  script:
    - npm install $NPM_FLAGS
    - npm run build
    - npm run build --prefix browser
    # lib/ must be in sync with src/ (the pre-built bundle is committed).
    - git diff --exit-code -- lib browser/lib ||
      (echo "ERROR: lib/ is out of sync with src/. Run 'npm run build' and commit." && exit 1)
  rules:
    - changes:
        - "src/**/*"
        - "browser/src/**/*"
        - "package.json"
        - "browser/package.json"
        - "esbuild.config.mjs"
        - "browser/esbuild.config.mjs"

test:
  stage: test
  script:
    - npm install $NPM_FLAGS
    - npx vitest run
  rules:
    - changes:
        - "src/**/*"
        - "test/**/*"
        - "package.json"
        - "vitest.config.ts"
