name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# The plugin ships a pre-built lib/ (so npm git-install needs no esbuild).
# This CI guards that contract:
#   - build:     re-bundle both packages from src/ (catches syntax/import
#                errors) and fail if the committed lib/ is stale.
#   - typecheck: tsc (core + browser) against the local `@deepseek-ai/*` peer
#                stubs (types/deepseek-ai.d.ts). Fast and reliable. A stricter
#                check against the real DSH host sources is available locally
#                via `DSH_HOST=... npm run typecheck:host` (not run in CI).
#   - test:      vitest (SSRF guard, store, enrichment/platform SSRF,
#                browser screenshot + approval).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + lib-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --legacy-peer-deps: the @deepseek-ai/* peer deps are provided by the
        # host DSH at runtime; in CI they are absent, so skip peer resolution
        # and install only the dev deps (esbuild, typescript) + cheerio.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build core (dsh-web-automation)
        run: npm run build

      - name: Build browser (dsh-web-browser)
        run: npm run build --prefix browser

      - name: Verify committed lib/ is in sync with src/
        run: |
          if ! git diff --exit-code -- lib browser/lib; then
            echo "::error::Committed lib/ is stale. Run 'npm run build' (and 'npm run build --prefix browser') and commit the rebuilt lib/."
            git diff --stat -- lib browser/lib
            exit 1
          fi
          echo "lib/ is in sync with src/."

  typecheck:
    name: Typecheck (stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck core + browser (against the local peer stubs)
        run: npm run typecheck

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run vitest
        run: npx vitest run
