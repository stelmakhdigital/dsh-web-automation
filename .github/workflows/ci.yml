name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# The plugin ships a pre-built lib/ (so npm git-install needs no esbuild).
# This CI guards that contract:
#   - build:         re-bundle both packages from src/ (catches syntax/import
#                    errors) and fail if the committed lib/ is stale.
#   - typecheck-host: BLOCKING tsc against the REAL DSH host source types
#                    (shallow-clone deepseek-harness, map the @deepseek-ai/*
#                    peer deps to their sources via the host's own paths map,
#                    tsc --noEmit). Stricter than the local stub typecheck.
#   - test:          vitest (SSRF guard, store, enrichment/platform SSRF,
#                    browser screenshot + approval).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + lib-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --legacy-peer-deps: the @deepseek-ai/* peer deps are provided by the
        # host DSH at runtime; in CI they are absent, so skip peer resolution
        # and install only the dev deps (esbuild, typescript) + cheerio.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build core (dsh-web-automation)
        run: npm run build

      - name: Build browser (dsh-web-browser)
        run: npm run build --prefix browser

      - name: Verify committed lib/ is in sync with src/
        run: |
          if ! git diff --exit-code -- lib browser/lib; then
            echo "::error::Committed lib/ is stale. Run 'npm run build' (and 'npm run build --prefix browser') and commit the rebuilt lib/."
            git diff --stat -- lib browser/lib
            exit 1
          fi
          echo "lib/ is in sync with src/."

  typecheck-host:
    name: Typecheck (host sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install plugin dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Shallow-clone the DSH host
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git deepseek-harness

      - name: Install host dependencies (third-party type resolution)
        # The host typechecks from source (no lib/ build); its third-party
        # imports resolve from the host's own node_modules. --ignore-scripts
        # skips native builds / client bundles (not needed for types).
        run: |
          cd deepseek-harness
          corepack enable
          pnpm install --no-frozen-lockfile --ignore-scripts --no-audit

      - name: Typecheck against host sources
        env:
          DSH_HOST: ${{ github.workspace }}/deepseek-harness
        run: npm run typecheck:host

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run vitest
        run: npx vitest run
