# GitLab CI for dsh-web-automation.
#
# Stages:
#   1. typecheck — tsc (core + browser) against the `types/deepseek-ai.d.ts`
#      stubs (fast; the `@deepseek-ai/*` peer deps are not installed in the
#      plugin's own `node_modules`).
#   2. typecheck-host — BLOCKING tsc against the REAL DSH host source types:
#      shallow-clone deepseek-harness, map the `@deepseek-ai/*` peer deps to
#      their sources via the host's own paths map (scripts/resolve-host-types.mjs),
#      `tsc --noEmit`. Stricter than the stub typecheck.
#   3. build — esbuild (core + browser), verify lib/ is in sync.
#   4. test  — vitest (SSRF guard, store, enrichment/platform SSRF, browser).
#
# The build (esbuild) is the authoritative gate: it bundles the real code and
# fails on syntax/import errors. The host typecheck is the strictest static
# check (real host types, not stubs).

image: node:22

stages:
  - typecheck
  - build
  - test

variables:
  # Peer deps are absent outside a DSH deployment; skip peer resolution.
  NPM_FLAGS: "--legacy-peer-deps --no-audit --no-fund"

typecheck:
  stage: typecheck
  script:
    - npm install $NPM_FLAGS
    - npm run typecheck
  rules:
    - changes:
        - "src/**/*"
        - "browser/src/**/*"
        - "types/**/*"
        - "tsconfig.json"
        - "browser/tsconfig.json"
        - "package.json"

# BLOCKING strict typecheck against the real DSH host source types. The host
# is shallow-cloned and its deps installed so the host's third-party imports
# resolve; the @deepseek-ai/* peer deps map to the host's sources via the
# host's own paths map (no lib/ build needed).
typecheck-host:
  stage: typecheck
  script:
    - npm install $NPM_FLAGS
    - git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git deepseek-harness
    - cd deepseek-harness
    - corepack enable
    - pnpm install --no-frozen-lockfile --ignore-scripts --no-audit
    - cd ..
    - DSH_HOST=$CI_PROJECT_DIR/deepseek-harness npm run typecheck:host
  rules:
    - changes:
        - "src/**/*"
        - "browser/src/**/*"
        - "types/**/*"
        - "scripts/**/*"
        - "tsconfig.json"
        - "browser/tsconfig.json"
        - "package.json"

build:
  stage: build
  script:
    - npm install $NPM_FLAGS
    - npm run build
    - npm run build --prefix browser
    # lib/ must be in sync with src/ (the pre-built bundle is committed).
    - git diff --exit-code -- lib browser/lib ||
      (echo "ERROR: lib/ is out of sync with src/. Run 'npm run build' and commit." && exit 1)
  rules:
    - changes:
        - "src/**/*"
        - "browser/src/**/*"
        - "package.json"
        - "browser/package.json"
        - "esbuild.config.mjs"
        - "browser/esbuild.config.mjs"

test:
  stage: test
  script:
    - npm install $NPM_FLAGS
    - npx vitest run
  rules:
    - changes:
        - "src/**/*"
        - "test/**/*"
        - "package.json"
        - "vitest.config.ts"
